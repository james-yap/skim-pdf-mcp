[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skim-pdf-mcp"
version = "0.1.0"
description = "Local MCP server that bridges the Skim PDF reader to ChatGPT: underline-driven reading context with rendered pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "skim-pdf-mcp contributors" }]
keywords = ["mcp", "skim", "pdf", "chatgpt", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=3.0",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
skim-pdf-mcp = "skim_pdf_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skim_pdf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
  "live_skim: needs macOS with Skim running and automation permission; skipped unless --live-skim is passed",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["PT018"]  # compound asserts read fine in tests

[tool.ruff.lint.isort]
known-first-party = ["skim_pdf_mcp"]
known-local-folder = ["fakes"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
# PyMuPDF ships no type information, so calls into it are untyped by necessity.
disallow_untyped_calls = false
